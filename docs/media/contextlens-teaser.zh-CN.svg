<linearGradient id="rule"><stop stop-color="#a987ff"/><stop offset="1" stop-color="#2de0ce"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91a2d7" stroke-opacity=".055"/></pattern>
</defs>
