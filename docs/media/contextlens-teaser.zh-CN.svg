<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC', Arial, sans-serif">
<title id="title">文脉镜：一个老地址、四个关联视图与可追溯的来源</title>
<desc id="desc">上海历史地址演示的流程示意图。输入地址和年代后，系统解析道路别名，将地址身份、历史事件、古今地图和证据来源组织成相互关联的档案。用户可以检查来源档案、打开原始记录、下载档案 JSON，以及打印。存在歧义时需要选择候选地址，不受支持的输入返回无法解析。年代提供上下文，地图位置有精度边界，来源可追溯不等于历史叙述已被证实。</desc>
