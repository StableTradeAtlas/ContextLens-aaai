<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc" font-family="Arial, 'Noto Sans CJK SC', sans-serif">
<title id="title">ContextLens: one historical address, four connected views, inspectable sources</title>
<desc id="desc">Workflow schematic of the implemented Shanghai address demo. An address and era enter alias resolution. The resulting dossier connects Identity, Events, Atlas, and Sources. Users inspect Source Passports, open original records, download dossier JSON, and print. Ambiguous inputs require a choice; unsupported inputs remain unresolved. The era is a contextual hint, map precision is limited, and source traceability does not establish historical truth.</desc>
